-calendar-picker-indicator,.date-time-row input[type="time"]::-webkit-calendar-picker-indicator{margin:0;padding:0}.people{display:flex;gap:8px;flex-wrap:wrap}.person{min-width:54px;border:2px solid #d1d5db;background:#fff}.person.selected{background:#111827;color:#fff;border-color:#111827}.mode button.active{background:#111827;color:#fff}.status{padding:9px 11px;border-radius:9px;background:#f3f4f6;margin-top:8px}.ok{background:#ecfdf5;color:#065f46}.err{background:#fef2f2;color:#991b1b}.record{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}.record b{font-size:16px}.money{font-variant-numeric:tabular-nums}.hidden{display:none!important}hr{border:0;border-top:1px solid #e5e7eb;margin:14px 0}.tag{display:inline-block;background:#eef2ff;border-radius:99px;padding:3px 8px;margin:2px;font-size:13px}.transfer{padding:5px 0}footer{text-align:center;color:#6b7280;font-size:12px;padding:20px}#modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}#modal>div{background:#fff;border-radius:16px;padding:18px;width:min(420px,100%)}</style></head><body>
<h1>🍽️ 外出用餐紀錄 V3.7</h1>
<div class="card"><div class="row"><button class="primary" onclick="showToday()">📅 今日用餐</button><button onclick="unlockHistory()">🔐 歷史紀錄</button></div><div id="cloudStatus" class="status">尚未連線雲端</div></div>
<section id="todaySection"><div class="card"><h2>新增今日用餐</h2><div class="date-time-row"><div><label>日期</label><input id="date" type="date"></div><div><label>時間</label><input id="time" type="time"></div></div><div class="location-head"><label style="margin:10px 0 5px">餐廳</label><button class="icon-btn" type="button" title="常用地點" aria-label="常用地點" onclick="toggleFavorites()">⭐</button></div><input id="restaurant" placeholder="例如：鼎泰豐"><div class="row" style="margin-top:8px"><button onclick="getLocation()">📍 取得目前位置</button><button onclick="nearbyRestaurants()">🔎 搜尋附近餐廳</button></div><div id="locationStatus" class="small"></div><div id="favoriteArea" class="favorite-list hidden"></div><div id="nearby"></div><label>用餐人員</label><div id="people" class="people"></div><div class="small">點選加入本次用餐的人。</div><label>總餐費</label><input id="total" type="number" min="0" step="1" inputmode="decimal" placeholder="例如：1200"><label>分攤方式</label><div class="row mode" id="splitMode"><button data-v="average" class="active" onclick="setSplit('average')">平均分攤</button><button data-v="individual" onclick="setSplit('individual')">個別金額</button></div><div id="owedArea"></div><label>付款方式</label><div class="row mode"><button id="singleBtn" class="active" onclick="setPay('single')">單一付款人</button><button id="multiBtn" onclick="setPay('multi')">多人付款</button></div><div id="paidArea"></div><div id="result" class="card" style="background:#f9fafb"></div><button class="primary" style="width:100%" onclick="saveRecord()">☁️ 儲存今日紀錄</button></div><div class="card"><h2>📅 今日紀錄</h2><div id="todayRecords"><div class="small">載入中…</div></div></div></section>
<section id="historySection" class="hidden"><div class="card"><div class="row"><button onclick="showToday()">📅 今日</button><button class="danger" onclick="lockHistory()">🔒 鎖定歷史</button></div><label>搜尋歷史紀錄</label><input id="historySearch" placeholder="日期、餐廳、人員…" oninput="renderHistory()"></div><div class="card"><h2>📚 歷史紀錄</h2><div id="historyRecords"></div></div></section><footer>V3.7 · GitHub Pages + Supabase</footer>
<div id="modal" class="hidden"><div><h2>🔐 解鎖歷史紀錄</h2><p class="small">輸入群組密碼。解鎖後，本次瀏覽期間不需重複輸入。</p><input id="historyPassword" type="password" placeholder="群組密碼" autocomplete="current-password"><div class="row" style="margin-top:12px"><button onclick="closeModal()">取消</button><button class="primary" onclick="doHistoryLogin()">解鎖</button></div><div id="loginMsg" class="small" style="margin-top:8px"></div></div></div>
<script>
// ===== ① Supabase 設定：完成 Supabase 後只修改這 3 個值 =====
const SUPABASE_URL="https://rgpowulqlelzxwomyxpf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_7V-TylH1m3Rl5O9CRkxK6w_vry7H6o-";
const HISTORY_LOGIN_EMAIL="pearl.rice@micmdt.com";
const PEOPLE=["A","S","E","J","P"];
let selected=new Set(),splitMode="average",payMode="single",owed={},paid={},history=[],myLocation=null;
const $=id=>document.getElementById(id),isConfigured=()=>SUPABASE_URL.startsWith("https://")&&!SUPABASE_URL.includes("YOUR_")&&SUPABASE_PUBLISHABLE_KEY.startsWith("sb_")&&!SUPABASE_PUBLISHABLE_KEY.includes("YOUR_")&&HISTORY_LOGIN_EMAIL.includes("@");
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};const nowTime=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};const money=n=>"NT$ "+Number(n||0).toLocaleString("zh-TW",{minimumFractionDigits:0,maximumFractionDigits:2});const cents=n=>Math.round(Number(n||0)*100);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function setStatus(t,k="status"){$("cloudStatus").className="status "+k;$('cloudStatus').textContent=t}function selectedPeople(){return PEOPLE.filter(p=>selected.has(p))}
const FAVORITES_KEY="dining_record_favorites_v1";
function getFavorites(){try{const v=JSON.parse(localStorage.getItem(FAVORITES_KEY)||"[]");return Array.isArray(v)?v:[]}catch(e){return []}}
function saveFavorites(a){try{localStorage.setItem(FAVORITES_KEY,JSON.stringify(a))}catch(e){alert("無法儲存常用地點，請確認 Safari 的網站資料儲存功能未被停用。")}}
function toggleFavorites(){const e=$("favoriteArea");if(!e)return;e.classList.toggle("hidden");if(!e.classList.contains("hidden"))renderFavorites()}
function renderFavorites(){const e=$("favoriteArea"),a=getFavorites();if(!a.length){e.innerHTML='<div class="small">目前還沒有常用地點。可在附近餐廳搜尋結果按 ⭐ 加入。</div>';return}e.innerHTML="";a.forEach((f,i)=>{const row=document.createElement("div");row.className="favorite-item";const name=document.createElement("button");name.className="name";name.type="button";name.textContent=f.name;name.addEventListener("click",()=>pickFavorite(i));row.appendChild(name);const del=document.createElement("button");del.className="danger";del.type="button";del.textContent="🗑️";del.title="刪除常用地點";del.setAttribute("aria-label","刪除常用地點");del.addEventListener("click",()=>deleteFavorite(i));row.appendChild(del);e.appendChild(row)})}
function addFavorite(name,lat=null,lng=null){name=String(name||"").trim();if(!name)return;const a=getFavorites();const idx=a.findIndex(f=>f.name===name);const item={name,lat:Number.isFinite(lat)?lat:null,lng:Number.isFinite(lng)?lng:null};if(idx>=0)a[idx]=item;else a.push(item);saveFavorites(a);renderFavorites();$("favoriteArea").classList.remove("hidden")}
function pickFavorite(i){const a=getFavorites(),f=a[i];if(!f)return;$("restaurant").value=f.name;if(Number.isFinite(f.lat)&&Number.isFinite(f.lng))myLocation={lat:f.lat,lng:f.lng};window.scrollTo({top:0,behavior:"smooth"})}
function deleteFavorite(i){const a=getFavorites();if(!a[i])return;if(!confirm(`確定要刪除「${a[i].name}」嗎？`))return;a.splice(i,1);saveFavorites(a);renderFavorites()}
function init(){$("date").value=todayStr();$("time").value=nowTime();PEOPLE.forEach(p=>{owed[p]=0;paid[p]=0});renderPeople();renderOwed();renderPaid();updateResult();if(isConfigured())setStatus("雲端設定已完成，正在連線…");else setStatus("請先完成 Supabase 設定，再使用雲端功能。","err");loadToday()}
function renderPeople(){$("people").innerHTML=PEOPLE.map(p=>`<button class="person ${selected.has(p)?"selected":""}" onclick="togglePerson('${p}')">${p}</button>`).join("")}
function togglePerson(p){selected.has(p)?selected.delete(p):selected.add(p);renderPeople();renderOwed();renderPaid();updateResult()}
function setSplit(v){splitMode=v;if(v==='individual')PEOPLE.forEach(p=>owed[p]=0);[...$('splitMode').children].forEach(b=>b.classList.toggle('active',b.dataset.v===v));renderOwed();updateResult()}
function setPay(v){payMode=v;$('singleBtn').classList.toggle('active',v==='single');$('multiBtn').classList.toggle('active',v==='multi');renderPaid();updateResult()}
function renderOwed(){const ps=selectedPeople(),total=cents($('total').value);if(!ps.length){$('owedArea').innerHTML='<div class="small">請先選擇用餐人員。</div>';return}if(splitMode==='average'){const base=Math.floor(total/ps.length),rem=total-base*ps.length;ps.forEach((p,i)=>owed[p]=(base+(i<rem?1:0))/100);$('owedArea').innerHTML=ps.map(p=>`<span class="tag">${p}：${money(owed[p])}</span>`).join('')}else{$('owedArea').innerHTML=ps.map(p=>`<div class="row" style="align-items:center;margin:5px 0"><b style="width:40px">${p}</b><input data-person="${p}" type="number" min="0" step="1" inputmode="decimal" value="${owed[p]||''}" placeholder="應付金額" oninput="owed[this.dataset.person]=Number(this.value||0);updateOwedStatus();updateResult()"></div>`).join('')+'<div id="owedStatus" class="small"></div>';updateOwedStatus()}}
function updateOwedStatus(){const e=$('owedStatus');if(!e)return;const s=selectedPeople().reduce((a,p)=>a+cents(owed[p]),0),t=cents($('total').value),d=t-s;e.textContent=d===0?`應付合計：${money(s/100)} / 總餐費：${money(t/100)} ✓ 已相符`:d>0?`應付合計：${money(s/100)} / 總餐費：${money(t/100)}　尚差：${money(d/100)}`:`應付合計：${money(s/100)} / 總餐費：${money(t/100)}　超出：${money((-d)/100)}`;e.className='small '+(d===0?'ok':'err')}
function renderPaid(){const ps=selectedPeople();if(!ps.length){$('paidArea').innerHTML='';return}if(payMode==='single'){const cur=ps.includes(paid.__payer)?paid.__payer:ps[0];paid.__payer=cur;$('paidArea').innerHTML=`<select id="payerSelect" onchange="paid.__payer=this.value">${ps.map(p=>`<option ${p===cur?'selected':''}>${p}</option>`).join('')}</select>`}else{$('paidArea').innerHTML=ps.map(p=>`<div class="row" style="align-items:center;margin:5px 0"><b style="width:40px">${p}</b><input data-paid="${p}" type="number" min="0" step="1" inputmode="decimal" value="${paid[p]||''}" placeholder="實際付款" oninput="paid[this.dataset.paid]=Number(this.value||0);updatePaidStatus();updateResult()"></div>`).join('')+'<div id="paidStatus" class="small"></div>';updatePaidStatus()}}
function updatePaidStatus(){const e=$('paidStatus');if(!e)return;const s=selectedPeople().reduce((a,p)=>a+cents(paid[p]),0),t=cents($('total').value),d=t-s;e.textContent=d===0?`付款合計：${money(s/100)} / 總餐費：${money(t/100)} ✓ 已相符`:d>0?`付款合計：${money(s/100)} / 總餐費：${money(t/100)}　尚差：${money(d/100)}`:`付款合計：${money(s/100)} / 總餐費：${money(t/100)}　超出：${money((-d)/100)}`;e.className='small '+(d===0?'ok':'err')}
$('total').addEventListener('input',()=>{if(splitMode==='average')renderOwed();else updateOwedStatus();if(payMode==='multi')updatePaidStatus();updateResult()});
function calculateTransfers(){const ps=selectedPeople(),payMap={};if(payMode==='single')payMap[paid.__payer||ps[0]]=cents($('total').value);else ps.forEach(p=>payMap[p]=cents(paid[p]));const bal=ps.map(p=>({p,v:(payMap[p]||0)-cents(owed[p])})),cr=bal.filter(x=>x.v>0).map(x=>({...x})),db=bal.filter(x=>x.v<0).map(x=>({p:x.p,v:-x.v})),tr=[];let i=0,j=0;while(i<db.length&&j<cr.length){const a=Math.min(db[i].v,cr[j].v);if(a>0)tr.push({from:db[i].p,to:cr[j].p,amount:a/100});db[i].v-=a;cr[j].v-=a;if(db[i].v===0)i++;if(cr[j].v===0)j++}return tr}
function updateResult(){const ps=selectedPeople(),t=cents($('total').value);if(!ps.length){$('result').innerHTML='<b>請選擇用餐人員</b>';return}const os=ps.reduce((a,p)=>a+cents(owed[p]),0),psm=payMode==='single'?t:ps.reduce((a,p)=>a+cents(paid[p]),0);let h=`<b>結算</b><br>應付：${money(os/100)}　付款：${money(psm/100)}<hr>`;if(os!==t)h+='<div class="err">⚠️ 應付金額與總餐費不同</div>';if(payMode==='multi'&&psm!==t)h+='<div class="err">⚠️ 付款合計與總餐費不同</div>';const tr=calculateTransfers();h+=tr.length?tr.map(x=>`<div class="transfer">${x.from} → ${x.to}：<b>${money(x.amount)}</b></div>`).join(''):'<div>目前不需要轉帳。</div>';$('result').innerHTML=h}
async function api(path,opt={}){if(!isConfigured())throw Error('尚未完成 Supabase 設定');const h={apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json',...(opt.headers||{})},tok=sessionStorage.getItem('history_access_token');h.Authorization='Bearer '+(tok||SUPABASE_PUBLISHABLE_KEY);const r=await fetch(SUPABASE_URL+path,{...opt,headers:h}),tx=await r.text();let d=null;try{d=tx?JSON.parse(tx):null}catch{}if(!r.ok)throw Error(d?.message||d?.msg||d?.error_description||tx||`HTTP ${r.status}`);return d}
async function loadToday(){if(!isConfigured()){$('todayRecords').innerHTML='<div class="small">完成 Supabase 設定後即可同步。</div>';return}try{const d=await api(`/rest/v1/dining_records?record_date=eq.${todayStr()}&select=*&order=meal_time.desc,created_at.desc`);renderRecords(d||[],$('todayRecords'));setStatus('☁️ 已連線，今日資料已同步','ok')}catch(e){$('todayRecords').innerHTML=`<div class="err">載入失敗：${esc(e.message)}</div>`;setStatus('雲端連線失敗','err')}}
function recordText(r,allowDelete=false){const people=(r.participants||[]).join('、'),tr=(r.transfers||[]).map(x=>`${x.from}→${x.to} ${money(x.amount)}`).join('；');return `<div class="record"><b>${esc(r.restaurant||'未填餐廳')}</b>　<span class="small">${esc(r.record_date)} ${esc(r.meal_time||'')}</span><br><span class="tag">${esc(people)}</span> <span class="tag">${r.split_mode==='average'?'平均':'個別'}</span> <span class="tag">${r.pay_mode==='single'?'單一付款':'多人付款'}</span><br>總餐費：<b>${money(r.total)}</b>${tr?`<hr><span class="small">結算：${esc(tr)}</span>`:''}${allowDelete?`<hr><button class="danger" onclick="deleteRecord(${Number(r.id)})">🗑️ 刪除此筆紀錄</button>`:''}</div>`}
function renderRecords(a,e,allowDelete=false){e.innerHTML=a.length?a.map(r=>recordText(r,allowDelete)).join(''):'<div class="small">目前沒有紀錄。</div>'}
async function saveRecord(){if(!isConfigured())return alert('請先完成 Supabase 設定。');const ps=selectedPeople(),total=Number($('total').value||0);if(!ps.length)return alert('請至少選擇一位用餐人員。');if(total<0)return alert('請輸入正確總餐費。');if(splitMode==='individual'&&ps.reduce((a,p)=>a+cents(owed[p]),0)!==cents(total))return alert('個別應付金額合計必須等於總餐費。');if(payMode==='multi'&&ps.reduce((a,p)=>a+cents(paid[p]),0)!==cents(total))return alert('多人付款合計必須等於總餐費。');const payload={record_date:$('date').value,meal_time:$('time').value,restaurant:$('restaurant').value.trim(),participants:ps,total,split_mode:splitMode,pay_mode:payMode,owed:Object.fromEntries(ps.map(p=>[p,Number(owed[p]||0)])),paid:payMode==='single'?{[paid.__payer||ps[0]]:total}:Object.fromEntries(ps.map(p=>[p,Number(paid[p]||0)])),transfers:calculateTransfers(),latitude:myLocation?.lat??null,longitude:myLocation?.lng??null};try{await api('/rest/v1/dining_records',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});alert('已儲存到雲端！');$('restaurant').value='';$('total').value='';selected.clear();PEOPLE.forEach(p=>{owed[p]=0;paid[p]=0});paid.__payer=null;renderPeople();renderOwed();renderPaid();updateResult();loadToday()}catch(e){alert('儲存失敗：'+e.message)}}
function unlockHistory(){if(sessionStorage.getItem('history_access_token'))return loadHistory();$('modal').classList.remove('hidden');$('historyPassword').focus()}function closeModal(){$('modal').classList.add('hidden');$('loginMsg').textContent='';$('historyPassword').value=''}
async function doHistoryLogin(){const pw=$('historyPassword').value;if(!pw)return;$('loginMsg').textContent='驗證中…';try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:HISTORY_LOGIN_EMAIL,password:pw})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'密碼錯誤');sessionStorage.setItem('history_access_token',d.access_token);closeModal();loadHistory()}catch(e){$('loginMsg').textContent='❌ '+e.message}}
async function loadHistory(){$('todaySection').classList.add('hidden');$('historySection').classList.remove('hidden');$('historyRecords').innerHTML='<div class="small">載入歷史紀錄中…</div>';try{history=await api('/rest/v1/dining_records?select=*&order=record_date.desc,meal_time.desc,created_at.desc');renderHistory()}catch(e){$('historyRecords').innerHTML=`<div class="err">歷史載入失敗：${esc(e.message)}</div>`}}
function renderHistory(){const q=($('historySearch').value||'').toLowerCase().trim();renderRecords(history.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q)),$('historyRecords'),true)}async function deleteRecord(id){if(!sessionStorage.getItem('history_access_token'))return alert('請先解鎖歷史紀錄。');if(!confirm('確定要刪除這筆紀錄嗎？此操作無法復原。'))return;try{await api('/rest/v1/dining_records?id=eq.'+encodeURIComponent(id),{method:'DELETE'});history=history.filter(r=>Number(r.id)!==Number(id));renderHistory();}catch(e){alert('刪除失敗：'+e.message)}}function lockHistory(){sessionStorage.removeItem('history_access_token');history=[];$('historySection').classList.add('hidden');$('todaySection').classList.remove('hidden')}function showToday(){$('historySection').classList.add('hidden');$('todaySection').classList.remove('hidden');loadToday()}
function getLocation(){if(!navigator.geolocation){$('locationStatus').textContent='此瀏覽器不支援定位';return}$('locationStatus').textContent='定位中…';navigator.geolocation.getCurrentPosition(p=>{myLocation={lat:p.coords.latitude,lng:p.coords.longitude};$('locationStatus').textContent=`已取得位置：${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`},e=>$('locationStatus').textContent='定位失敗：'+e.message,{enableHighAccuracy:true,timeout:10000})}
async function nearbyRestaurants(){
  if(!myLocation){getLocation();return alert('請先允許定位，再按一次搜尋附近餐廳。')}
  const lat0=Number(myLocation.lat),lng0=Number(myLocation.lng);
  if(!Number.isFinite(lat0)||!Number.isFinite(lng0)||lat0<-90||lat0>90||lng0<-180||lng0>180){
    $('nearby').innerHTML='<div class="err">目前定位資料格式異常，請重新取得目前位置。</div>';return;
  }
  $('nearby').innerHTML='<div class="small">搜尋中…</div>';
  const q=`[out:json][timeout:20];(nwr["amenity"="restaurant"](around:1200,${lat0},${lng0});nwr["amenity"="cafe"](around:1200,${lat0},${lng0}););out center tags;`;
  try{
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:q});
    if(!r.ok) throw Error(`附近餐廳服務暫時無法使用（HTTP ${r.status}）`);
    const text=await r.text();
    let d;try{d=JSON.parse(text)}catch(e){throw Error('附近餐廳服務回傳的資料格式無法讀取。')}
    const list=(d.elements||[]).filter(x=>x?.tags?.name).slice(0,20);
    const el=$('nearby');el.innerHTML='';
    if(!list.length){el.innerHTML='<div class="small">找不到附近餐廳。</div>';return;}
    list.forEach(x=>{
      const n=String(x.tags.name||'').trim();
      const lat=Number(x.lat??x.center?.lat),lng=Number(x.lon??x.center?.lon);
      const card=document.createElement('div');card.className='record';
      const title=document.createElement('b');title.textContent=n;card.appendChild(title);card.appendChild(document.createElement('br'));
      const pick=document.createElement('button');pick.textContent='選取';pick.addEventListener('click',()=>pickRestaurant(n));card.appendChild(pick);card.appendChild(document.createTextNode(' '));
      const fav=document.createElement('button');fav.className='icon-btn';fav.type='button';fav.title='加入常用地點';fav.setAttribute('aria-label','加入常用地點');fav.textContent='⭐';
      fav.addEventListener('click',()=>addFavorite(n,Number.isFinite(lat)?lat:null,Number.isFinite(lng)?lng:null));card.appendChild(fav);card.appendChild(document.createTextNode(' '));
      if(Number.isFinite(lat)&&Number.isFinite(lng)){
        const map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(`${lat},${lng}`);
        const a=document.createElement('a');a.href=map;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Google Maps';card.appendChild(a);
      }
      el.appendChild(card);
    });
  }catch(e){$('nearby').innerHTML=`<div class="err">搜尋失敗：${esc(e?.message||'未知錯誤')}</div>`}
}
function pickRestaurant(n){$('restaurant').value=n;window.scrollTo({top:0,behavior:'smooth'})}
init();
</script></body></html>
