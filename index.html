const $=id=>document.getElementById(id),isConfigured=()=>SUPABASE_URL.startsWith("https://")&&!SUPABASE_URL.includes("YOUR_")&&SUPABASE_PUBLISHABLE_KEY.startsWith("sb_")&&!SUPABASE_PUBLISHABLE_KEY.includes("YOUR_")&&HISTORY_LOGIN_EMAIL.includes("@");
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};const nowTime=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};const money=n=>"NT$ "+Number(n||0).toLocaleString("zh-TW",{minimumFractionDigits:0,maximumFractionDigits:2});const cents=n=>Math.round(Number(n||0)*100);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function setStatus(t,k="status"){$("cloudStatus").className="status "+k;$('cloudStatus').textContent=t}function selectedPeople(){return PEOPLE.filter(p=>selected.has(p))}
const FAVORITES_KEY="dining_record_favorites_v1";
function getFavorites(){try{const v=JSON.parse(localStorage.getItem(FAVORITES_KEY)||"[]");return Array.isArray(v)?v:[]}catch(e){return []}}

function toggleFavorites(){const e=$("favoriteArea");if(!e)return;e.classList.toggle("hidden");if(!e.classList.contains("hidden"))renderFavorites()}

function addFavorite(name,lat=null,lng=null){name=String(name||"").trim();if(!name)return;const a=getFavorites();const idx=a.findIndex(f=>f.name===name);const item={name,lat:Number.isFinite(lat)?lat:null,lng:Number.isFinite(lng)?lng:null};if(idx>=0)a[idx]=item;else a.push(item);saveFavorites(a);renderFavorites();$("favoriteArea").classList.remove("hidden")}

function init(){$("date").value=todayStr();$("time").value=nowTime();PEOPLE.forEach(p=>{meals[p]=0;owed[p]=0;paid[p]=0});renderPeople();renderOwed();renderPaid();updateResult();if(isConfigured())setStatus("雲端設定已完成，正在連線…");else setStatus("請先完成 Supabase 設定，再使用雲端功能。","err");loadToday();loadWallets()}
function renderPeople(){$("people").innerHTML=PEOPLE.map(p=>`<button class="person ${selected.has(p)?"selected":""}" onclick="togglePerson('${p}')">${p}</button>`).join("")}
function togglePerson(p){selected.has(p)?selected.delete(p):selected.add(p);renderPeople();renderOwed();renderPaid();updateResult()}
function setSplit(v){splitMode=v;if(v==='individual')PEOPLE.forEach(p=>{meals[p]=0;owed[p]=0});[...$('splitMode').children].forEach(b=>b.classList.toggle('active',b.dataset.v===v));renderOwed();updateResult()}
function setPay(v){payMode=v;$('singleBtn').classList.toggle('active',v==='single');$('multiBtn').classList.toggle('active',v==='multi');renderPaid();updateResult()}
function sideDishShares(ps=selectedPeople()){if(!ps.length)return {};const total=cents($('sideDishTotal').value),base=Math.floor(total/ps.length),rem=total-base*ps.length;return Object.fromEntries(ps.map((p,i)=>[p,base+(i<rem?1:0)]))}
function updateIndividualOwed(){const ps=selectedPeople(),shares=sideDishShares(ps);ps.forEach(p=>{owed[p]=(cents(meals[p])+(shares[p]||0))/100;const side=document.querySelector(`[data-side="${p}"]`),due=document.querySelector(`[data-owed="${p}"]`);if(side)side.textContent=money((shares[p]||0)/100);if(due)due.textContent=money(owed[p])});updateOwedStatus();updateResult()}
function renderOwed(){const ps=selectedPeople(),total=cents($('total').value);if(!ps.length){$('owedArea').innerHTML='<div class="small">請先選擇用餐人員。</div>';return}if(splitMode==='average'){const base=Math.floor(total/ps.length),rem=total-base*ps.length;ps.forEach((p,i)=>owed[p]=(base+(i<rem?1:0))/100);$('owedArea').innerHTML=ps.map(p=>`<span class="tag">${p}：${money(owed[p])}</span>`).join('')}else{$('owedArea').innerHTML='<div class="individual-head"><span>人員</span><span>個人主餐</span><span>小菜/人</span><span>應付金額</span></div>'+ps.map(p=>`<div class="individual-row"><b>${p}</b><input aria-label="${p} 個人主餐" data-meal="${p}" type="number" min="0" step="1" inputmode="decimal" value="${meals[p]||''}" placeholder="主餐" oninput="meals[this.dataset.meal]=Number(this.value||0);updateIndividualOwed()"><span class="calculated-amount" data-side="${p}"></span><b class="calculated-amount" data-owed="${p}"></b></div>`).join('')+'<div id="owedStatus" class="small"></div>';updateIndividualOwed()}}
function updateOwedStatus(){const e=$('owedStatus');if(!e)return;const s=selectedPeople().reduce((a,p)=>a+cents(owed[p]),0),t=cents($('total').value),d=t-s;e.textContent=d===0?`應付合計：${money(s/100)} / 總餐費：${money(t/100)} ✓ 已相符`:d>0?`應付合計：${money(s/100)} / 總餐費：${money(t/100)}　尚差：${money(d/100)}`:`應付合計：${money(s/100)} / 總餐費：${money(t/100)}　超出：${money((-d)/100)}`;e.className='small '+(d===0?'ok':'err')}
function renderPaid(){if(payMode==='single'){const cur=PEOPLE.includes(paid.__payer)?paid.__payer:'S';paid.__payer=cur;$('paidArea').innerHTML=`<select id="payerSelect" aria-label="付款人" onchange="paid.__payer=this.value;updateResult()">${PEOPLE.map(p=>`<option ${p===cur?'selected':''}>${p}</option>`).join('')}</select>`}else{$('paidArea').innerHTML=PEOPLE.map(p=>`<div class="row" style="align-items:center;margin:5px 0"><b style="width:40px">${p}</b><input data-paid="${p}" type="number" min="0" step="1" inputmode="decimal" value="${paid[p]||''}" placeholder="實際付款" oninput="paid[this.dataset.paid]=Number(this.value||0);updatePaidStatus();updateResult()"></div>`).join('')+'<div id="paidStatus" class="small"></div>';updatePaidStatus()}}
function updatePaidStatus(){const e=$('paidStatus');if(!e)return;const s=PEOPLE.reduce((a,p)=>a+cents(paid[p]),0),t=cents($('total').value),d=t-s;e.textContent=d===0?`付款合計：${money(s/100)} / 總餐費：${money(t/100)} ✓ 已相符`:d>0?`付款合計：${money(s/100)} / 總餐費：${money(t/100)}　尚差：${money(d/100)}`:`付款合計：${money(s/100)} / 總餐費：${money(t/100)}　超出：${money((-d)/100)}`;e.className='small '+(d===0?'ok':'err')}
$('total').addEventListener('input',()=>{if(splitMode==='average')renderOwed();else updateOwedStatus();if(payMode==='multi')updatePaidStatus();updateResult()});
$('sideDishTotal').addEventListener('input',()=>{if(splitMode==='individual')renderOwed()});
function calculateTransfers(){const ps=selectedPeople(),payMap={};if(payMode==='single')payMap[paid.__payer||'S']=cents($('total').value);else PEOPLE.forEach(p=>payMap[p]=cents(paid[p]));const bal=PEOPLE.map(p=>({p,v:(payMap[p]||0)-(ps.includes(p)?cents(owed[p]):0)})),cr=bal.filter(x=>x.v>0).map(x=>({...x})),db=bal.filter(x=>x.v<0).map(x=>({p:x.p,v:-x.v})),tr=[];let i=0,j=0;while(i<db.length&&j<cr.length){const a=Math.min(db[i].v,cr[j].v);if(a>0)tr.push({from:db[i].p,to:cr[j].p,amount:a/100,settled:false,settled_at:null,settlement_method:null});db[i].v-=a;cr[j].v-=a;if(db[i].v===0)i++;if(cr[j].v===0)j++}return tr}
function deriveSettlementStatus(transfers){if(!Array.isArray(transfers)||!transfers.length)return'not_required';if(transfers.some(t=>typeof t?.settled!=='boolean'))return'unknown';const count=transfers.filter(t=>t.settled).length;return count===0?'unsettled':count===transfers.length?'settled':'partial'}
const SETTLEMENT_LABELS={unknown:'⚪ 未記錄',unsettled:'🔴 未結清',partial:'🟡 部分結清',settled:'🟢 已結清',not_required:'⚪ 無需結清'};
function settlementLabel(status){return SETTLEMENT_LABELS[status]||SETTLEMENT_LABELS.unknown}

function isMissingSettlementColumn(error){return/settlement_status|schema cache/i.test(String(error?.message||error))}

async function api(path,opt={}){if(!isConfigured())throw Error('尚未完成 Supabase 設定');const h={apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json',...(opt.headers||{})},tok=sessionStorage.getItem('history_access_token');h.Authorization='Bearer '+(tok||SUPABASE_PUBLISHABLE_KEY);const r=await fetch(SUPABASE_URL+path,{...opt,headers:h}),tx=await r.text();let d=null;try{d=tx?JSON.parse(tx):null}catch{}if(!r.ok){const e=Error(d?.message||d?.msg||d?.error_description||tx||`HTTP ${r.status}`);e.status=r.status;throw e}return d}

async function loadWallets(){if(!isConfigured())return;try{const rows=await api('/rest/v1/wallets?select=person,balance,updated_at&order=person');wallets=Object.fromEntries(PEOPLE.map(p=>[p,Number(rows?.find(w=>w.person===p)?.balance||0)]));renderWalletSummary();renderWalletManager()}catch(e){$('walletSummary').innerHTML='<div class="small">請先執行 V4.0 wallet migration。</div>'}}
function renderWalletSummary(){$('walletSummary').innerHTML=PEOPLE.map(p=>`<div class="wallet-chip ${wallets[p]<0?'wallet-negative':''}"><b>${p}</b><br><span class="money">${money(wallets[p])}</span></div>`).join('')}
function renderWalletManager(){const el=$('walletManager');if(!el)return;el.innerHTML=PEOPLE.map(p=>`<div class="wallet-person"><b>${p}</b><div class="wallet-balance ${wallets[p]<0?'wallet-negative':''}">${money(wallets[p])}</div><div class="wallet-actions"><button onclick="walletTopup('${p}')">儲值</button><button onclick="walletAdjust('${p}')">調整</button><button onclick="loadWalletHistory('${p}')">交易明細</button></div></div>`).join('')}
function openWalletManager(){$('todaySection').classList.add('hidden');$('historySection').classList.add('hidden');$('walletSection').classList.remove('hidden');loadWallets()}
function unlockWallet(){if(sessionStorage.getItem('history_access_token'))return openWalletManager();openLogin('wallet')}
function requireWalletAuth(){if(sessionStorage.getItem('history_access_token'))return true;alert('請先使用「登入管理」解鎖後再操作錢包。');return false}
async function walletChange(person,type){if(walletBusy||!requireWalletAuth())return;const raw=prompt(type==='topup'?`${person} 儲值金額（正數）`:`${person} 調整金額（可正可負）`);if(raw===null)return;const amount=Number(raw);if(!Number.isFinite(amount)||amount===0||type==='topup'&&amount<=0)return alert('請輸入正確金額。');let note=type==='topup'?'儲值':prompt('請輸入調整原因（必填）');if(type==='adjustment'&&!String(note||'').trim())return alert('調整必須填寫原因。');walletBusy=true;renderWalletManager();$('walletManager').classList.add('busy');try{await rpc('wallet_apply_change',{p_person:person,p_type:type,p_amount:amount,p_note:note,p_reference_key:requestKey(`wallet-${type}:${person}`)});await loadWallets();await loadWalletHistory(person)}catch(e){alert('操作失敗，錢包與結清狀態未變更，請稍後再試。\n'+e.message)}finally{walletBusy=false;$('walletManager')?.classList.remove('busy')}}
function walletTopup(person){walletChange(person,'topup')}function walletAdjust(person){walletChange(person,'adjustment')}
async function loadWalletHistory(person){if(!requireWalletAuth())return;$('walletHistoryTitle').textContent=`${person} 錢包交易明細`;$('walletHistory').innerHTML='載入中…';try{const rows=await api(`/rest/v1/wallet_transactions?person=eq.${encodeURIComponent(person)}&select=*&order=created_at.desc,id.desc&limit=50`);$('walletHistory').innerHTML=rows.length?rows.map(t=>`<div class="wallet-history-item"><span class="small">${settlementDate(t.created_at)}</span><br><span class="wallet-history-amount ${Number(t.amount)<0?'wallet-negative':''}">${Number(t.amount)>0?'+':''}${money(t.amount)}</span>　${({topup:'儲值',settlement:'餐費結清',adjustment:'人工調整',reversal:'撤銷結清'})[t.type]||esc(t.type)}<br><span class="small">餘額 ${money(t.balance_after)}${t.note?` · ${esc(t.note)}`:''}</span></div>`).join(''):'<div class="small">目前沒有交易。</div>'}catch(e){$('walletHistory').innerHTML=`<div class="err">交易明細載入失敗：${esc(e.message)}</div>`}}
async function loadToday(){if(!isConfigured()){$('todayRecords').innerHTML='<div class="small">完成 Supabase 設定後即可同步。</div>';return}try{const d=await api(`/rest/v1/dining_records?record_date=eq.${todayStr()}&select=*&order=meal_time.desc,created_at.desc`);renderRecords(d||[],$('todayRecords'));setStatus('☁️ 已連線，今日資料已同步','ok')}catch(e){$('todayRecords').innerHTML=`<div class="err">載入失敗：${esc(e.message)}</div>`;setStatus('雲端連線失敗','err')}}
function settlementMethodLabel(t){if(!t?.settled)return'';return t.settlement_method==='wallet'?`${esc(t.from)} 錢包`:t.settlement_method==='cash'?'現金':'未記錄'}
function transferRows(r,editable){const transfers=Array.isArray(r.transfers)?r.transfers:[];return transfers.map((t,i)=>{const tracked=typeof t.settled==='boolean',done=t.settled===true,date=settlementDate(t.settled_at);let action;if(!editable)action=`<span class="small">${tracked?(done?'✅ 已結清':'⬜ 未結清'):'⚪ 未記錄'}</span>`;else if(done)action=`<div><div class="small">✅ 已結清<br>方式：${settlementMethodLabel(t)}${date?`<br>日期：${date}`:''}</div><button type="button" class="settlement-btn" data-wallet-action onclick="unsetTransferSettlement(${Number(r.id)},${i},this)">取消結清</button></div>`;else action=`<div><div class="small">結清方式：</div><div class="transfer-methods"><button type="button" data-wallet-action onclick="settleTransferCash(${Number(r.id)},${i},this)">現金</button><button type="button" data-wallet-action onclick="settleTransferWallet(${Number(r.id)},${i},this)">${esc(t.from)} 錢包</button></div></div>`;return `<div class="transfer"><span class="transfer-main"><b>${esc(t.from)} → ${esc(t.to)}</b>　<span class="money">${money(t.amount)}</span></span>${action}</div>`}).join('')}
function recordText(r,allowDelete=false){const people=(r.participants||[]).join('、'),transfers=Array.isArray(r.transfers)?r.transfers:[],status=deriveSettlementStatus(transfers),sideDish=Number(r.side_dish_total||0),pending=transfers.filter(t=>t.settled===false).map(t=>`${esc(t.from)} → ${esc(t.to)} ${money(t.amount)}`).join('；'),canSettle=allowDelete&&transfers.length>0,hasOpen=transfers.some(t=>t.settled!==true);return `<div class="record"><b>${esc(r.restaurant||'未填餐廳')}</b>　<span class="small">${esc(r.record_date)} ${esc(r.meal_time||'')}</span><br><span class="tag">${esc(people)}</span> <span class="tag">${r.split_mode==='average'?'平均':'個別'}</span> <span class="tag">${r.pay_mode==='single'?'單一付款':'多人付款'}</span><br>總餐費：<b>${money(r.total)}</b>　小菜：<b>${money(sideDish)}</b><br><span class="settlement-status">${settlementLabel(status)}</span>${pending?`<div class="small pending-summary">待付款：${pending}</div>`:''}${transfers.length?`<hr><div class="small">轉帳結算</div>${transferRows(r,canSettle)}${canSettle&&hasOpen?`<div class="settlement-actions"><button type="button" data-wallet-action onclick="settleAllCash(${Number(r.id)},this)">✅ 全部以現金結清</button></div>`:''}`:''}${allowDelete?`<hr><button class="danger" onclick="deleteRecord(${Number(r.id)})">🗑️ 刪除此筆紀錄</button>`:''}</div>`}
function renderRecords(a,e,allowDelete=false){e.innerHTML=a.length?a.map(r=>recordText(r,allowDelete)).join(''):'<div class="small">目前沒有紀錄。</div>'}
async function persistSettlement(record,transfers){const settlement_status=deriveSettlementStatus(transfers),body={transfers,settlement_status};try{await api('/rest/v1/dining_records?id=eq.'+encodeURIComponent(record.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)})}catch(e){if(!isMissingSettlementColumn(e))throw e;await api('/rest/v1/dining_records?id=eq.'+encodeURIComponent(record.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({transfers})});setStatus('⚠️ 請執行 V3.9 migration；結清明細已保存，但快速篩選欄位尚未建立。','err')}record.transfers=transfers;record.settlement_status=settlement_status;renderHistory()}
function setWalletActionBusy(button,busy){document.querySelectorAll('[data-wallet-action]').forEach(b=>b.disabled=busy);if(button)button.textContent=busy?'處理中…':button.dataset.label||button.textContent}
async function settleTransferCash(id,index,button){if(walletBusy||!requireWalletAuth())return;const record=history.find(r=>Number(r.id)===Number(id));if(!record?.transfers?.[index])return;walletBusy=true;button.dataset.label=button.textContent;setWalletActionBusy(button,true);const now=new Date().toISOString(),transfers=record.transfers.map((t,i)=>i===index?{...t,settled:true,settled_at:now,settlement_method:'cash'}:{...t,settled:typeof t.settled==='boolean'?t.settled:false,settled_at:typeof t.settled==='boolean'?(t.settled_at||null):null,settlement_method:typeof t.settled==='boolean'?(t.settlement_method??null):null});try{await persistSettlement(record,transfers)}catch(e){alert('更新結清狀態失敗：'+e.message)}finally{walletBusy=false;setWalletActionBusy(button,false)}}
async function settleAllCash(id,button){if(walletBusy||!requireWalletAuth())return;const record=history.find(r=>Number(r.id)===Number(id));if(!record?.transfers?.length||!confirm('確定將所有未結清項目以現金結清？'))return;walletBusy=true;button.dataset.label=button.textContent;setWalletActionBusy(button,true);const now=new Date().toISOString(),transfers=record.transfers.map(t=>t.settled===true?{...t,settled:true,settled_at:t.settled_at||now,settlement_method:t.settlement_method??null}:{...t,settled:true,settled_at:now,settlement_method:'cash'});try{await persistSettlement(record,transfers)}catch(e){alert('全部結清失敗：'+e.message)}finally{walletBusy=false;setWalletActionBusy(button,false)}}
async function settleTransferWallet(id,index,button){if(walletBusy||!requireWalletAuth())return;const record=history.find(r=>Number(r.id)===Number(id)),t=record?.transfers?.[index];if(!t)return;const balance=Number(wallets[t.from]||0),after=(cents(balance)-cents(t.amount))/100;if(!confirm(`${t.from} 目前錢包餘額：${money(balance)}\n本次扣款：${money(t.amount)}\n扣款後餘額：${money(after)}${after<0?'\n\n提醒：扣款後錢包餘額將為負數，但仍可結清。':''}\n\n確認以 ${t.from} 錢包結清？`))return;walletBusy=true;button.dataset.label=button.textContent;setWalletActionBusy(button,true);try{const data=await rpc('settle_transfer_with_wallet',{p_dining_record_id:Number(id),p_transfer_index:index,p_reference_key:`wallet-settlement:${id}:${index}:${t.from}:${t.to}:${cents(t.amount)}:${Number(t.wallet_cycle||0)}`});record.transfers=data.transfers||record.transfers;record.settlement_status=data.settlement_status||deriveSettlementStatus(record.transfers);await loadWallets();await loadHistory()}catch(e){alert('操作失敗，錢包與結清狀態未變更，請稍後再試。\n'+e.message)}finally{walletBusy=false;setWalletActionBusy(button,false)}}
async function unsetTransferSettlement(id,index,button){if(walletBusy||!requireWalletAuth())return;const record=history.find(r=>Number(r.id)===Number(id)),t=record?.transfers?.[index];if(!t||!confirm(t.settlement_method==='wallet'?'取消後會建立 reversal 並將扣款加回錢包。確定繼續？':'確定取消此筆現金結清？'))return;walletBusy=true;button.dataset.label=button.textContent;setWalletActionBusy(button,true);try{if(t.settlement_method==='wallet'){const source=t.wallet_transaction_id;if(!source)throw Error('缺少 wallet transaction reference');const data=await rpc('reverse_wallet_settlement',{p_dining_record_id:Number(id),p_transfer_index:index,p_reference_key:`wallet-reversal:${source}`});record.transfers=data.transfers||record.transfers;record.settlement_status=data.settlement_status||deriveSettlementStatus(record.transfers);await loadWallets();await loadHistory()}else{const transfers=record.transfers.map((x,i)=>i===index?{...x,settled:false,settled_at:null,settlement_method:null}:{...x});await persistSettlement(record,transfers)}}catch(e){alert('操作失敗，錢包與結清狀態未變更，請稍後再試。\n'+e.message)}finally{walletBusy=false;setWalletActionBusy(button,false)}}
async function saveRecord(){
  if(!isConfigured())return alert('請先完成 Supabase 設定。');
  if($('date').value!==todayStr()&&!sessionStorage.getItem('history_access_token'))return openLogin('save');
  const ps=selectedPeople(),total=Number($('total').value||0),sideDishTotal=Number($('sideDishTotal').value||0);
  if(!ps.length)return alert('請至少選擇一位用餐人員。');
  if(total<0)return alert('請輸入正確總餐費。');
  if(sideDishTotal<0)return alert('請輸入正確小菜金額。');
  if(splitMode==='individual'&&ps.reduce((a,p)=>a+cents(owed[p]),0)!==cents(total))return alert('個別應付金額合計必須等於總餐費。');
  if(payMode==='multi'&&PEOPLE.reduce((a,p)=>a+cents(paid[p]),0)!==cents(total))return alert('多人付款合計必須等於總餐費。');
  const transfers=calculateTransfers();
  const payload={
    record_date:$('date').value,meal_time:$('time').value,restaurant:$('restaurant').value.trim(),participants:ps,total,
    side_dish_total:sideDishTotal,split_mode:splitMode,pay_mode:payMode,
    owed:Object.fromEntries(ps.map(p=>[p,Number(owed[p]||0)])),
    paid:payMode==='single'?{[paid.__payer||'S']:total}:Object.fromEntries(PEOPLE.filter(p=>cents(paid[p])!==0).map(p=>[p,Number(paid[p])])),
    transfers,settlement_status:deriveSettlementStatus(transfers),latitude:myLocation?.lat??null,longitude:myLocation?.lng??null
  };
  try{
    try{await api('/rest/v1/dining_records',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)})}
    catch(e){
      if(!isMissingSettlementColumn(e))throw e;
      const fallback={...payload};delete fallback.settlement_status;
      await api('/rest/v1/dining_records',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(fallback)});
      setStatus('⚠️ 已保存結清明細；請執行 V3.9 migration 以啟用 settlement_status 欄位。','err');
    }
    alert('已儲存到雲端！');$('restaurant').value='';$('total').value='';$('sideDishTotal').value='';selected.clear();
    PEOPLE.forEach(p=>{meals[p]=0;owed[p]=0;paid[p]=0});paid.__payer='S';renderPeople();renderOwed();renderPaid();updateResult();loadToday();
  }catch(e){
    if($('date').value!==todayStr()&&e.status===401){sessionStorage.removeItem('history_access_token');openLogin('save','登入已過期，請重新登入後繼續儲存。');return}
    alert('儲存失敗：'+e.message)
  }
}
function openLogin(intent='history',message=''){loginIntent=intent;$('loginTitle').textContent=intent==='save'?'🔐 登入後補登':intent==='wallet'?'🔐 解鎖錢包管理':'🔐 解鎖歷史紀錄';$('loginDescription').textContent=message||(intent==='save'?'非今日紀錄需要登入。登入成功後會自動繼續儲存，表單內容不會遺失。':'輸入群組密碼。解鎖後，本次瀏覽期間不需重複輸入。');$('loginSubmit').textContent=intent==='save'?'登入並儲存':'解鎖';$('modal').classList.remove('hidden');$('historyPassword').focus()}
function unlockHistory(){if(sessionStorage.getItem('history_access_token'))return loadHistory();openLogin('history')}function closeModal(){$('modal').classList.add('hidden');$('loginMsg').textContent='';$('historyPassword').value='';loginIntent='history'}
async function doHistoryLogin(){const pw=$('historyPassword').value;if(!pw)return;$('loginMsg').textContent='驗證中…';const intent=loginIntent;try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:HISTORY_LOGIN_EMAIL,password:pw})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'密碼錯誤');sessionStorage.setItem('history_access_token',d.access_token);closeModal();if(intent==='save')await saveRecord();else if(intent==='wallet')openWalletManager();else loadHistory()}catch(e){$('loginMsg').textContent='❌ '+e.message}}
async function loadHistory(){$('walletSection').classList.add('hidden');$('todaySection').classList.add('hidden');$('historySection').classList.remove('hidden');$('historyRecords').innerHTML='<div class="small">載入歷史紀錄中…</div>';try{history=await api('/rest/v1/dining_records?select=*&order=record_date.desc,meal_time.desc,created_at.desc');renderHistory()}catch(e){$('historyRecords').innerHTML=`<div class="err">歷史載入失敗：${esc(e.message)}</div>`}}
function setHistoryFilter(value){historyFilter=value;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===value));renderHistory()}function renderHistory(){const q=($('historySearch').value||'').toLowerCase().trim();renderRecords(history.filter(r=>{const status=deriveSettlementStatus(r.transfers),matchesFilter=historyFilter==='all'||historyFilter==='pending'&&['unsettled','partial'].includes(status)||historyFilter==='completed'&&['settled','not_required'].includes(status);return matchesFilter&&(!q||JSON.stringify(r).toLowerCase().includes(q))}),$('historyRecords'),true)}async function deleteRecord(id){if(!sessionStorage.getItem('history_access_token'))return alert('請先解鎖歷史紀錄。');if(!confirm('確定要刪除這筆紀錄嗎？此操作無法復原。'))return;try{await api('/rest/v1/dining_records?id=eq.'+encodeURIComponent(id),{method:'DELETE'});history=history.filter(r=>Number(r.id)!==Number(id));renderHistory();}catch(e){alert('刪除失敗：'+e.message)}}function lockHistory(){sessionStorage.removeItem('history_access_token');history=[];$('historySection').classList.add('hidden');$('walletSection').classList.add('hidden');$('todaySection').classList.remove('hidden')}function showToday(){$('walletSection').classList.add('hidden');$('historySection').classList.add('hidden');$('todaySection').classList.remove('hidden');loadToday()}
function getLocation(){if(!navigator.geolocation){$('locationStatus').textContent='此瀏覽器不支援定位';return}$('locationStatus').textContent='定位中…';navigator.geolocation.getCurrentPosition(p=>{myLocation={lat:p.coords.latitude,lng:p.coords.longitude};$('locationStatus').textContent=`已取得位置：${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`},e=>$('locationStatus').textContent='定位失敗：'+e.message,{enableHighAccuracy:true,timeout:10000})}
async function fetchOverpass(q){
  let lastError=null;
  for(const endpoint of OVERPASS_ENDPOINTS){
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),OVERPASS_REQUEST_TIMEOUT_MS);
    try{
      const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:q,signal:controller.signal});
      if(!r.ok){const e=Error(`HTTP ${r.status}`);e.retryable=r.status>=500&&r.status<=599;e.status=r.status;throw e}
      const text=await r.text();
      let data;try{data=JSON.parse(text)}catch(e){const invalid=Error('回傳資料不是有效的 JSON');invalid.retryable=true;throw invalid}
      if(!Array.isArray(data?.elements)){const invalid=Error('回傳資料缺少 elements');invalid.retryable=true;throw invalid}
      return data;
    }catch(e){
      const isTimeout=e?.name==='AbortError',isNetwork=e instanceof TypeError;
      e.retryable=e.retryable===true||isTimeout||isNetwork;
      lastError=e;
      console.warn('Overpass endpoint failed',{endpoint,timeout:isTimeout,status:e.status||null,error:e});
      if(!e.retryable)throw e;
    }finally{clearTimeout(timer)}
  }
  const e=Error('所有 Overpass endpoints 皆無法使用');e.allEndpointsFailed=true;e.cause=lastError;throw e;
}
async function nearbyRestaurants(){
  if(nearbySearchInProgress)return;
  if(!myLocation){getLocation();return alert('請先允許定位，再按一次搜尋附近餐廳。')}
  const lat0=Number(myLocation.lat),lng0=Number(myLocation.lng);
  if(!Number.isFinite(lat0)||!Number.isFinite(lng0)||lat0<-90||lat0>90||lng0<-180||lng0>180){
    $('nearby').innerHTML='<div class="err">目前定位資料格式異常，請重新取得目前位置。</div>';return;
  }
  const button=$('nearbySearchButton');nearbySearchInProgress=true;button.disabled=true;button.setAttribute('aria-busy','true');button.textContent='搜尋中…';
  $('nearby').innerHTML='<div class="small">搜尋中…</div>';
  const q=`[out:json][timeout:10];nwr["amenity"~"^(restaurant|cafe)$"](around:1200,${lat0},${lng0});out center tags;`;
  try{
    const d=await fetchOverpass(q);
    const list=(d.elements||[]).filter(x=>x?.tags?.name).slice(0,20);
    const el=$('nearby');el.innerHTML='';
    if(!list.length){el.innerHTML='<div class="small">找不到附近餐廳。</div>';return;}
    list.forEach(x=>{
      const n=String(x.tags.name||'').trim();
      const lat=Number(x.lat??x.center?.lat),lng=Number(x.lon??x.center?.lon);
      const card=document.createElement('div');card.className='record';
      const title=document.createElement('b');title.textContent=n;card.appendChild(title);card.appendChild(document.createElement('br'));
      const pick=document.createElement('button');pick.textContent='選取';pick.addEventListener('click',()=>pickRestaurant(n));card.appendChild(pick);card.appendChild(document.createTextNode(' '));
      const fav=document.createElement('button');fav.className='icon-btn';fav.type='button';fav.title='加入常用地點';fav.setAttribute('aria-label','加入常用地點');fav.textContent='⭐';
      fav.addEventListener('click',()=>addFavorite(n,Number.isFinite(lat)?lat:null,Number.isFinite(lng)?lng:null));card.appendChild(fav);card.appendChild(document.createTextNode(' '));
      if(Number.isFinite(lat)&&Number.isFinite(lng)){
        const map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(`${lat},${lng}`);
        const a=document.createElement('a');a.href=map;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Google Maps';card.appendChild(a);
      }
      el.appendChild(card);
    });
  }catch(e){
    console.error('Nearby restaurant search failed',e);
    $('nearby').innerHTML=e.allEndpointsFailed?'<div class="err">附近餐廳服務目前較忙碌，請稍後再試。</div>':'<div class="err">附近餐廳搜尋設定有誤，請稍後再試。</div>';
  }finally{nearbySearchInProgress=false;button.disabled=false;button.removeAttribute('aria-busy');button.textContent='🔎 搜尋附近餐廳'}
}
function pickRestaurant(n){$('restaurant').value=n;window.scrollTo({top:0,behavior:'smooth'})}
init();
