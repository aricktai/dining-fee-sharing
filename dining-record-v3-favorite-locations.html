function people(){return PP.filter(x=>picked.has(x))}function stat(s,k=''){Q('cloudStatus').className='status '+k;Q('cloudStatus').textContent=s}function ready(){return SB_URL.startsWith('https://')&&SB_KEY.startsWith('sb_')}
function drawPeople(){Q('people').innerHTML=PP.map(x=>`<button class="person ${picked.has(x)?'selected':''}" onclick="flip('${x}')">${x}</button>`).join('')}function flip(x){picked.has(x)?picked.delete(x):picked.add(x);drawPeople();drawOwe();drawPay();refresh()}
function split(v){sm=v;Q('averageBtn').classList.toggle('active',v==='average');Q('individualBtn').classList.toggle('active',v==='individual');if(v==='individual')people().forEach(x=>owe[x]=0);drawOwe();refresh()}function paidMode(v){pm=v;Q('singleBtn').classList.toggle('active',v==='single');Q('multiBtn').classList.toggle('active',v==='multi');drawPay();refresh()}
function drawOwe(){let ps=people(),t=ct(Q('total').value);if(!ps.length){Q('owedArea').innerHTML='<div class="small">Select people first.</div>';return}if(sm==='average'){let b=Math.floor(t/ps.length),r=t-b*ps.length;ps.forEach((x,i)=>owe[x]=(b+(i<r?1:0))/100);Q('owedArea').innerHTML=ps.map(x=>`<span class="tag">${x}: ${cash(owe[x])}</span>`).join('')}else{Q('owedArea').innerHTML=ps.map(x=>`<div class="input-line"><b>${x}</b><input data-o="${x}" type="number" min="0" step="1" inputmode="decimal" value="${owe[x]||''}" placeholder="Amount" oninput="owe[this.dataset.o]=Number(this.value||0);refresh()"></div>`).join('')+'<div id="owedStatus"></div>'}}
function drawPay(){let ps=people();if(!ps.length){Q('paidArea').innerHTML='';return}if(pm==='single'){let x=ps.includes(pay.payer)?pay.payer:ps[0];pay.payer=x;Q('paidArea').innerHTML=`<label>Payer</label><select onchange="pay.payer=this.value;refresh()">${ps.map(y=>`<option ${x===y?'selected':''}>${y}</option>`).join('')}</select>`}else Q('paidArea').innerHTML=ps.map(x=>`<div class="input-line"><b>${x}</b><input data-p="${x}" type="number" min="0" step="1" inputmode="decimal" value="${pay[x]||''}" placeholder="Paid" oninput="pay[this.dataset.p]=Number(this.value||0);refresh()"></div>`).join('')+'<div id="paidStatus"></div>'}
function diff(label,a,t){let d=t-a;return d===0?`<div class="ok">${label}: ${cash(a/100)} / ${cash(t/100)} - matched</div>`:d>0?`<div class="err">${label}: ${cash(a/100)} / ${cash(t/100)} - remaining ${cash(d/100)}</div>`:`<div class="err">${label}: ${cash(a/100)} / ${cash(t/100)} - over by ${cash(-d/100)}</div>`}
function settle(){let ps=people(),t=ct(Q('total').value),actual={};if(pm==='single')actual[pay.payer||ps[0]]=t;else ps.forEach(x=>actual[x]=ct(pay[x]));let cr=ps.map(x=>({x,v:(actual[x]||0)-ct(owe[x])})).filter(z=>z.v>0),db=ps.map(x=>({x,v:ct(owe[x])-(actual[x]||0)})).filter(z=>z.v>0),out=[],i=0,j=0;while(i<db.length&&j<cr.length){let a=Math.min(db[i].v,cr[j].v);out.push({from:db[i].x,to:cr[j].x,amount:a/100});db[i].v-=a;cr[j].v-=a;if(!db[i].v)i++;if(!cr[j].v)j++}return out}
function refresh(){let ps=people(),t=ct(Q('total').value);if(!ps.length){Q('result').innerHTML='<b>Select people first.</b>';return}let os=ps.reduce((a,x)=>a+ct(owe[x]),0),as=pm==='single'?t:ps.reduce((a,x)=>a+ct(pay[x]),0);if(Q('owedStatus'))Q('owedStatus').innerHTML=diff('Individual total',os,t);if(Q('paidStatus'))Q('paidStatus').innerHTML=diff('Payment total',as,t);let h='<b>Settlement</b><hr>';if(sm==='individual')h+=diff('Individual total',os,t);if(pm==='multi')h+=diff('Payment total',as,t);let tr=settle();h+=tr.length?tr.map(x=>`<div>${x.from} → ${x.to}: <b>${cash(x.amount)}</b></div>`).join(''):'<div class="small">Amounts must match before transfers can be shown.</div>';Q('result').innerHTML=h}
Q('total').addEventListener('input',()=>{if(sm==='average')drawOwe();refresh()});
async function api(path,opt={}){if(!ready())throw Error('Supabase is not configured');let h={apikey:SB_KEY,'Content-Type':'application/json',...(opt.headers||{})},tok=sessionStorage.getItem('history_access_token');if(tok)h.Authorization='Bearer '+tok;let r=await fetch(SB_URL+path,{...opt,headers:h}),tx=await r.text(),d;try{d=tx?JSON.parse(tx):null}catch{}if(!r.ok)throw Error(d?.message||d?.error_description||tx||'Request failed');return d}
function osm(lat,lng){return `https://www.openstreetmap.org/?mlat=${encodeURIComponent(lat)}&mlon=${encodeURIComponent(lng)}#map=18/${encodeURIComponent(lat)}/${encodeURIComponent(lng)}`}function addr(t={}){return [t['addr:housenumber'],t['addr:street'],t['addr:district'],t['addr:city']].filter(Boolean).join('')||t['addr:full']||''}
function favs(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch{return[]}}function putFav(x){localStorage.setItem(FK,JSON.stringify(x))}function toggleFavorites(){Q('favorites').classList.toggle('hidden');showFavorites()}function showFavorites(){let box=Q('favorites'),a=favs();box.innerHTML='';if(!a.length){box.innerHTML='<div class="small">No favorites yet. Add one from nearby search.</div>';return}let note=document.createElement('div');note.className='small';note.textContent='Favorites are saved only in this browser on this device.';box.append(note);a.forEach(x=>{let c=document.createElement('div');c.className='record';c.innerHTML=`<b>${safe(x.name)}</b>${x.address?`<div class="small">${safe(x.address)}</div>`:''}<div class="small">${Number(x.latitude).toFixed(5)}, ${Number(x.longitude).toFixed(5)}</div>`;let r=document.createElement('div');r.className='row';let u=document.createElement('button');u.textContent='Use';u.onclick=()=>usePlace(x);let m=document.createElement('a');m.href=x.mapUrl||osm(x.latitude,x.longitude);m.target='_blank';m.rel='noopener';m.textContent='OpenStreetMap';let d=document.createElement('button');d.className='danger';d.textContent='Delete';d.onclick=()=>{if(confirm('Delete this favorite?')){putFav(favs().filter(y=>y.id!==x.id));showFavorites()}};r.append(u,m,d);c.append(r);box.append(c)})}function addFav(x){let a=favs();if(!a.some(y=>y.name===x.name&&Number(y.latitude)===Number(x.latitude)&&Number(y.longitude)===Number(x.longitude))){a.unshift({...x,id:Date.now(),mapUrl:x.mapUrl||osm(x.latitude,x.longitude)});putFav(a)}showFavorites()}function usePlace(x){Q('restaurant').value=x.name;loc={lat:Number(x.latitude),lng:Number(x.longitude)};Q('locationStatus').textContent='Selected: '+x.name+(x.address?' ('+x.address+')':'');Q('favorites').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function getLocation(){if(!navigator.geolocation){Q('locationStatus').textContent='Geolocation is unavailable.';return}Q('locationStatus').textContent='Getting location...';navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lng:p.coords.longitude};Q('locationStatus').textContent='Location ready: '+loc.lat.toFixed(5)+', '+loc.lng.toFixed(5)},e=>Q('locationStatus').textContent='Location error: '+e.message,{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}
async function nearbyRestaurants(){if(!loc){getLocation();alert('Get your location first, then search again.');return}let box=Q('nearby');box.innerHTML='<div class="small">Searching nearby places...</div>';let query=`[out:json][timeout:20];(nwr["amenity"="restaurant"](around:1200,${loc.lat},${loc.lng});nwr["amenity"="cafe"](around:1200,${loc.lat},${loc.lng}););out center tags;`;try{let r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json(),a=(d.elements||[]).map(z=>{let la=z.lat??z.center?.lat,lo=z.lon??z.center?.lon,t=z.tags||{};return la!=null&&lo!=null&&t.name?{name:t.name,address:addr(t),latitude:la,longitude:lo,mapUrl:osm(la,lo)}:null}).filter(Boolean).slice(0,20);box.innerHTML='';if(!a.length){box.textContent='No nearby places found.';return}a.forEach(x=>{let c=document.createElement('div');c.className='record';c.innerHTML=`<b>${safe(x.name)}</b>${x.address?`<div class="small">${safe(x.address)}</div>`:''}`;let row=document.createElement('div');row.className='row';let u=document.createElement('button');u.textContent='Use';u.onclick=()=>usePlace(x);let f=document.createElement('button');f.textContent='★ Favorite';f.onclick=()=>addFav(x);let m=document.createElement('a');m.href=x.mapUrl;m.target='_blank';m.rel='noopener';m.textContent='OpenStreetMap';row.append(u,f,m);c.append(row);box.append(c)})}catch(e){box.innerHTML='<div class="err">Search failed: '+safe(e.message)+'</div>'}}
function rec(r,del=false){let tr=(r.transfers||[]).map(x=>safe(x.from)+' → '+safe(x.to)+': '+cash(x.amount)).join('<br>');return `<div class="record"><b>${safe(r.restaurant||'No location')}</b><div class="small">${safe(r.record_date)} ${safe(r.meal_time||'')} · ${(r.participants||[]).map(safe).join(', ')}</div><div>Total: <b>${cash(r.total)}</b></div>${tr?'<hr><div class="small">'+tr+'</div>':''}${del?'<hr><button class="danger" onclick="deleteRecord('+Number(r.id)+')">Delete this record</button>':''}</div>`}function drawRecords(a,e,del=false){e.innerHTML=a.length?a.map(x=>rec(x,del)).join(''):'<div class="small">No records.</div>'}
async function loadToday(){try{let d=await api('/rest/v1/dining_records?record_date=eq.'+day()+'&select=*&order=meal_time.desc,created_at.desc');drawRecords(d||[],Q('todayRecords'));stat('Cloud connected.','ok')}catch(e){Q('todayRecords').innerHTML='<div class="err">Load failed: '+safe(e.message)+'</div>';stat('Cloud connection failed.','err')}}
async function saveRecord(){let ps=people(),total=Number(Q('total').value||0),os=ps.reduce((a,x)=>a+ct(owe[x]),0),pas=pm==='single'?ct(total):ps.reduce((a,x)=>a+ct(pay[x]),0);if(!ps.length)return alert('Select people first.');if(total<=0)return alert('Enter total amount.');if(sm==='individual'&&os!==ct(total))return alert('Individual amounts must equal total.');if(pm==='multi'&&pas!==ct(total))return alert('Payments must equal total.');let body={record_date:Q('date').value,meal_time:Q('time').value,restaurant:Q('restaurant').value.trim(),participants:ps,total,split_mode:sm,pay_mode:pm,owed:Object.fromEntries(ps.map(x=>[x,Number(owe[x]||0)])),paid:pm==='single'?{[pay.payer||ps[0]]:total}:Object.fromEntries(ps.map(x=>[x,Number(pay[x]||0)])),transfers:settle(),latitude:loc?.lat??null,longitude:loc?.lng??null};try{await api('/rest/v1/dining_records',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});alert('Saved.');Q('restaurant').value='';Q('total').value='';picked.clear();PP.forEach(x=>owe[x]=pay[x]=0);pay.payer=null;drawPeople();drawOwe();drawPay();refresh();loadToday()}catch(e){alert('Save failed: '+e.message)}}
function unlockHistory(){if(sessionStorage.getItem('history_access_token'))return loadHistory();Q('modal').classList.remove('hidden');Q('historyPassword').focus()}function closeModal(){Q('modal').classList.add('hidden');Q('historyPassword').value='';Q('loginMsg').textContent=''}async function doHistoryLogin(){let password=Q('historyPassword').value;if(!password)return;Q('loginMsg').textContent='Checking...';try{let r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:HISTORY_EMAIL,password})}),d=await r.json();if(!r.ok)throw Error(d.error_description||'Login failed');sessionStorage.setItem('history_access_token',d.access_token);closeModal();loadHistory()}catch(e){Q('loginMsg').textContent='Login failed: '+e.message}}async function loadHistory(){Q('todaySection').classList.add('hidden');Q('historySection').classList.remove('hidden');try{hist=await api('/rest/v1/dining_records?select=*&order=record_date.desc,meal_time.desc,created_at.desc');renderHistory()}catch(e){Q('historyRecords').innerHTML='<div class="err">Load failed: '+safe(e.message)+'</div>'}}function renderHistory(){let x=(Q('historySearch').value||'').toLowerCase().trim();drawRecords(hist.filter(r=>!x||JSON.stringify(r).toLowerCase().includes(x)),Q('historyRecords'),true)}async function deleteRecord(id){if(!confirm('Delete this history record?'))return;try{await api('/rest/v1/dining_records?id=eq.'+id,{method:'DELETE'});hist=hist.filter(x=>x.id!==id);renderHistory()}catch(e){alert('Delete failed: '+e.message)}}function lockHistory(){sessionStorage.removeItem('history_access_token');hist=[];showToday()}function showToday(){Q('historySection').classList.add('hidden');Q('todaySection').classList.remove('hidden');loadToday()}
init();
</script></body></html>
